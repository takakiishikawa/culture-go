name: refetch-image

on:
  workflow_dispatch:
    inputs:
      query:
        description: "title substring to match (ilike %query%)"
        required: true

jobs:
  refetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Refetch og:image
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run refetch-image -- "${{ github.event.inputs.query }}"
