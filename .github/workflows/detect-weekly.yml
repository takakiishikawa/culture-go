name: detect-weekly

on:
  # 日曜 02:00 Asia/Ho_Chi_Minh (UTC+7) = 土曜 19:00 UTC
  # （土曜深夜の totonoi ルーティンに当てるため、土→日の切り替わり直後）
  schedule:
    - cron: "0 19 * * 6"
  # 手動実行も可
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "lookback (days)"
        required: false
        default: "7"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Run detection
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DETECT_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
        run: npm run detect
