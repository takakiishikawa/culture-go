name: detect-weekly

on:
  # 日曜 02:00 Asia/Ho_Chi_Minh (UTC+7) = 土曜 19:00 UTC
  # （土曜深夜の totonoi ルーティンに当てるため、土→日の切り替わり直後）
  schedule:
    - cron: "0 19 * * 6"
  # 手動実行も可
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "lookback (days, default 7)"
        required: false
        default: "7"
      living_lookback_days:
        description: "Living lookback (days, default 45)"
        required: false
        default: "45"
      living_override_published_at:
        description: "Living override published_at (ISO8601, optional; backfill 特定週用)"
        required: false
        default: ""
      run_global:
        description: "Run global detection"
        required: false
        type: boolean
        default: true
      run_shift:
        description: "Run Saigon Shift (hcmc) detection"
        required: false
        type: boolean
        default: true
      run_living:
        description: "Run Saigon Living detection"
        required: false
        type: boolean
        default: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Run global detection
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_global == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional. og:image が取れなかった候補に対して英語キーワードで
          # Unsplash 検索フォールバックする。未設定なら静かにスキップ。
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          DETECT_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
        run: npm run detect

      - name: Run Saigon Shift (hcmc) detection
        # global 検出が失敗してもシフト検出は独立して走らせる
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_shift == 'true') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          DETECT_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
        run: npm run detect:hcmc

      - name: Run Saigon Living detection
        # 前段が失敗してもリビング検出は独立して走らせる
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_living == 'true') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          DETECT_LOOKBACK_DAYS: ${{ github.event.inputs.living_lookback_days || '45' }}
          LIVING_OVERRIDE_PUBLISHED_AT: ${{ github.event.inputs.living_override_published_at || '' }}
        run: npm run detect:living
